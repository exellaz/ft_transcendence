services:
  backend:
    build: ./backend
    expose:
      - "3000"
    working_dir: /app
    networks:
      - appnet
    volumes:
      - ./backend/prisma/database:/app/prisma/database
      - ./backend/uploads:/app/uploads
      - ./shared:/app/shared
    environment:
      - FORCE_COLOR=1
      - HOST=${HOST}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    build: ./frontend
    expose:
      - "5173"
    networks:
      - appnet
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./shared:/shared
    environment:
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VITE_API_URL= # This is meant to be empty

  nginx:
    build: ./nginx
    ports:
      - "8443:443"
      - "8080:80"
    networks:
      - appnet
    volumes:
      - ./nginx/certs:/etc/nginx/certs
      - ./backend/uploads:/usr/share/nginx/uploads:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - frontend
      - backend

volumes:
  frontend_node_modules:

networks:
  appnet:
    driver: bridge
