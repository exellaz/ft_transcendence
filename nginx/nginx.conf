events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/null;
    error_log /dev/null;

    # Detect API requests by checking for Authorization header
    map $http_authorization $is_api_request {
        default 0;
        "~^Bearer" 1;
    }

    upstream backend {
        server backend:3000;
    }

    upstream frontend {
        server frontend:5173;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name ${DOMAIN_NAME};
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ${DOMAIN_NAME};

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/${DOMAIN_NAME}.crt;
        ssl_certificate_key /etc/nginx/certs/${DOMAIN_NAME}.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location ~* ^/(ws-|online-status) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeouts (24 hours)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Backend API routes (excluding tournament/:id which is handled below)
        location ~ ^/(auth|users|friendships|blockedFriendships|friendChatMessages|rooms?|room|matches|create-room|create-tournament|update-tournament|list-tournaments|create-next-tournament|uploads|docs) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tournament routes - distinguish API calls from page navigation
        location ~ ^/tournament/[0-9]+$ {
            # If Authorization header is present (API call), go to backend
            if ($is_api_request = 1) {
                proxy_pass http://backend;
                break;
            }

            # Otherwise (browser navigation), serve frontend
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
