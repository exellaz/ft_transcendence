
services:
  frontend:
    container_name: ft_frontend
    build: ./frontend
    ports:
      - "5173:5173" # Vite dev server
      - "4173:4173" # Vite preview
    working_dir: /app
    depends_on:
      - backend
    networks:
      - appnet
  backend:
    container_name: ft_backend
    build: ./backend
    ports:
      - "4242:4242"
    working_dir: /app
    networks:
      - appnet
networks:
  appnet:
    driver: bridge

#could "docker start * -a" instead of "docker compose up"
