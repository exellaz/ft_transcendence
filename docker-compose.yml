services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      #- frontend_node_modules:/app/node_modules
    networks:
      - appnet
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./backend:/app
      #- backend_node_modules:/app/node_modules
      - ./backend/room.db:/app/room.db
    networks:
      - appnet
networks:
  appnet:
    driver: bridge

# Named volumes to persist node_modules directories
# 1. won't get overwritten by host mounts
# 2. won't get deleted on container removal
# 3. no need to reinstall node_modules on every container start or rebuild
volumes:
  frontend_node_modules:
  backend_node_modules:
